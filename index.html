<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ツール使い方ガイド</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    overflow: hidden;
  }

  /* ===== BOOK ===== */
  .book-wrap {
    perspective: 1800px;
    width: 320px;
    height: 420px;
    cursor: pointer;
    margin-bottom: 2.5rem;
    position: relative;
  }

  .book {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
  }

  /* 影 */
  .book-shadow {
    position: absolute;
    bottom: -24px;
    left: 50%;
    transform: translateX(-50%);
    width: 260px;
    height: 24px;
    background: radial-gradient(ellipse, rgba(0,0,0,0.5) 0%, transparent 70%);
    border-radius: 50%;
    transition: width 0.6s ease, opacity 0.6s ease;
  }

  /* 共通ページスタイル */
  .page {
    position: absolute;
    width: 100%;
    height: 100%;
    transform-origin: left center;
    transform-style: preserve-3d;
    border-radius: 4px 12px 12px 4px;
  }

  .page-front,
  .page-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 4px 12px 12px 4px;
    overflow: hidden;
  }

  .page-back {
    transform: rotateY(180deg);
  }

  /* 表紙 */
  .cover {
    z-index: 10;
    transition: transform 1.0s cubic-bezier(0.645, 0.045, 0.355, 1.000);
  }
  .cover.open {
    transform: rotateY(-160deg);
  }

  .cover .page-front {
    background: linear-gradient(160deg, #2d1b69 0%, #1a0533 100%);
    border: 1px solid rgba(255,255,255,0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    padding: 2rem;
    box-shadow: 6px 0 20px rgba(0,0,0,0.4), inset -4px 0 12px rgba(0,0,0,0.3);
  }

  .cover .page-back {
    background: #f0ece4;
  }

  .cover-title {
    font-size: 1.4rem;
    font-weight: 700;
    color: #fff;
    text-align: center;
    line-height: 1.5;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }

  .cover-icon {
    font-size: 3.5rem;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
  }

  .cover-sub {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.6);
    text-align: center;
    letter-spacing: 0.05em;
  }

  .cover-badge {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 20px;
    padding: 0.4rem 1rem;
    font-size: 0.75rem;
    color: rgba(255,255,255,0.9);
    margin-top: 0.5rem;
  }

  /* 背表紙風の左端装飾 */
  .cover .page-front::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 20px;
    background: linear-gradient(90deg, rgba(0,0,0,0.4), transparent);
    border-radius: 4px 0 0 4px;
  }

  /* ページ1 */
  .page1 {
    z-index: 9;
    transition: transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1.000) 0.15s;
  }
  .page1.open {
    transform: rotateY(-155deg);
  }

  .page1 .page-front {
    background: #faf7f2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    gap: 0.8rem;
    box-shadow: 4px 0 12px rgba(0,0,0,0.15);
  }

  .page1 .page-front .p-icon { font-size: 2.8rem; }
  .page1 .page-front .p-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: #1a1a2e;
  }
  .page1 .page-front .p-lines {
    width: 80%;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin-top: 0.5rem;
  }
  .page1 .page-front .p-line {
    height: 8px;
    border-radius: 4px;
    background: #e0dbd2;
  }
  .page1 .page-front .p-line:nth-child(2) { width: 85%; }
  .page1 .page-front .p-line:nth-child(3) { width: 70%; }
  .page1 .page-front .p-line:nth-child(4) { width: 90%; }
  .page1 .page-front .p-line:nth-child(5) { width: 60%; }

  .page1 .page-back {
    background: #faf7f2;
  }

  /* ページ2 */
  .page2 {
    z-index: 8;
    transition: transform 0.85s cubic-bezier(0.645, 0.045, 0.355, 1.000) 0.30s;
  }
  .page2.open {
    transform: rotateY(-152deg);
  }

  .page2 .page-front {
    background: #f5f0e8;
    box-shadow: 4px 0 10px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    gap: 0.8rem;
  }
  .page2 .page-front .p-icon { font-size: 2.8rem; }
  .page2 .page-front .p-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: #1a1a2e;
  }
  .page2 .page-front .p-lines {
    width: 80%;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin-top: 0.5rem;
  }
  .page2 .page-front .p-line {
    height: 8px;
    border-radius: 4px;
    background: #d8d0c4;
  }
  .page2 .page-front .p-line:nth-child(2) { width: 75%; }
  .page2 .page-front .p-line:nth-child(3) { width: 90%; }
  .page2 .page-front .p-line:nth-child(4) { width: 65%; }
  .page2 .page-front .p-line:nth-child(5) { width: 80%; }

  .page2 .page-back { background: #f5f0e8; }

  /* 裏表紙（常に表示される台） */
  .back-cover {
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(160deg, #1a0533 0%, #0d0020 100%);
    border-radius: 4px 12px 12px 4px;
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: inset 4px 0 12px rgba(0,0,0,0.4);
  }

  /* クリックヒント */
  .hint {
    position: absolute;
    bottom: 1.2rem;
    right: 1.5rem;
    font-size: 0.7rem;
    color: rgba(255,255,255,0.4);
    display: flex;
    align-items: center;
    gap: 0.3rem;
    animation: pulse 2s infinite;
    z-index: 20;
    pointer-events: none;
    transition: opacity 0.5s;
  }
  .hint.hidden { opacity: 0; }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.9; }
  }

  /* ===== カード（本が開いたら表示） ===== */
  .cards-section {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.6s ease 0.8s, transform 0.6s ease 0.8s;
    pointer-events: none;
  }
  .cards-section.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .section-title {
    font-size: 1rem;
    color: rgba(255,255,255,0.7);
    text-align: center;
    margin-bottom: 1.5rem;
    letter-spacing: 0.05em;
  }

  .cards {
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .card {
    background: rgba(255,255,255,0.95);
    border-radius: 14px;
    padding: 2rem 1.8rem;
    width: 240px;
    text-decoration: none;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.8rem;
  }
  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 14px 40px rgba(0,0,0,0.4);
  }
  .card .icon { font-size: 2.5rem; }
  .card .name {
    font-size: 1.1rem;
    font-weight: 700;
    color: #1a1a2e;
  }
  .card .desc {
    font-size: 0.8rem;
    color: #888;
    text-align: center;
    line-height: 1.6;
  }
  .card.slack { border-top: 4px solid #e8196b; }
  .card.notion { border-top: 4px solid #d4560a; }

  /* ページをめくるパーティクル的な装飾 */
  .sparkle {
    position: fixed;
    pointer-events: none;
    border-radius: 50%;
    animation: sparkleAnim 0.8s ease-out forwards;
  }
  @keyframes sparkleAnim {
    0%   { opacity: 1; transform: scale(0) translate(0,0); }
    100% { opacity: 0; transform: scale(1) translate(var(--tx), var(--ty)); }
  }
</style>
</head>
<body>

  <!-- 本 -->
  <div class="book-wrap" id="bookWrap" onclick="openBook()">
    <div class="book" id="book">
      <div class="back-cover"></div>

      <div class="page page2" id="page2">
        <div class="page-front">
          <div class="p-icon">📝</div>
          <div class="p-title">Notion ガイド</div>
          <div class="p-lines">
            <div class="p-line"></div>
            <div class="p-line"></div>
            <div class="p-line"></div>
            <div class="p-line"></div>
            <div class="p-line"></div>
          </div>
        </div>
        <div class="page-back"></div>
      </div>

      <div class="page page1" id="page1">
        <div class="page-front">
          <div class="p-icon">💬</div>
          <div class="p-title">Slack ガイド</div>
          <div class="p-lines">
            <div class="p-line"></div>
            <div class="p-line"></div>
            <div class="p-line"></div>
            <div class="p-line"></div>
            <div class="p-line"></div>
          </div>
        </div>
        <div class="page-back"></div>
      </div>

      <div class="page cover" id="cover">
        <div class="page-front">
          <div class="cover-icon">📚</div>
          <div class="cover-title">ツール<br>使い方ガイド</div>
          <div class="cover-sub">Slack &amp; Notion</div>
          <div class="cover-badge">✦ タップして開く</div>
        </div>
        <div class="page-back"></div>
      </div>
    </div>
    <div class="book-shadow" id="bookShadow"></div>
    <div class="hint" id="hint">👆 クリックして開く</div>
  </div>

  <!-- ガイドカード -->
  <div class="cards-section" id="cardsSection">
    <p class="section-title">ガイドを選んでください</p>
    <div class="cards">
      <a href="./slack-guide.html" class="card slack">
        <div class="icon">💬</div>
        <div class="name">Slack ガイド</div>
        <div class="desc">チャンネル・DM・通知設定など<br>Slack の基本から応用まで</div>
      </a>
      <a href="./notion-guide.html" class="card notion">
        <div class="icon">📝</div>
        <div class="name">Notion ガイド</div>
        <div class="desc">ページ作成・データベース・<br>チーム活用まで丁寧に解説</div>
      </a>
    </div>
  </div>

<script>
  let opened = false;

  function openBook() {
    if (opened) return;
    opened = true;

    document.getElementById('hint').classList.add('hidden');

    // スパークル演出
    spawnSparkles();

    // ページをパラパラめくる
    document.getElementById('cover').classList.add('open');
    document.getElementById('page1').classList.add('open');
    document.getElementById('page2').classList.add('open');

    // 影を広げる
    const shadow = document.getElementById('bookShadow');
    shadow.style.width = '320px';
    shadow.style.opacity = '0.7';

    // カード表示
    setTimeout(() => {
      document.getElementById('cardsSection').classList.add('visible');
    }, 700);
  }

  function spawnSparkles() {
    const wrap = document.getElementById('bookWrap');
    const rect = wrap.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    const colors = ['#e8196b', '#4a9eff', '#f59e0b', '#36c97e', '#a855f7', '#ffffff'];

    for (let i = 0; i < 18; i++) {
      const el = document.createElement('div');
      el.className = 'sparkle';
      const size = 6 + Math.random() * 8;
      const angle = (Math.PI * 2 * i) / 18 + Math.random() * 0.4;
      const dist = 60 + Math.random() * 80;
      el.style.cssText = `
        width:${size}px; height:${size}px;
        background:${colors[i % colors.length]};
        left:${cx - size/2}px; top:${cy - size/2}px;
        --tx:${Math.cos(angle)*dist}px;
        --ty:${Math.sin(angle)*dist}px;
        animation-delay:${Math.random()*0.3}s;
        opacity:0.9;
      `;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1200);
    }
  }
</script>
</body>
</html>
